services:
  amis-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    image: amis-ocr:latest
    container_name: amis-ocr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - APP_ENV=production
      - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN:-}
      - MAX_FILE_SIZE_BYTES=15728640
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
